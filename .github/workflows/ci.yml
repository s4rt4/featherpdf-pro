# Feather PDF Pro — continuous integration: build on Windows with MSVC + Qt 6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub refuses to rerun a run older than a month, so keep a manual trigger.
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows / MSVC / Qt 6)
    runs-on: windows-latest
    env:
      VCPKG_DEPS: freetype libjpeg-turbo openjpeg libpng tiff lcms zlib qpdf openssl
      # Both directories are pinned into the workspace so the cache action has
      # something it can actually find: left to itself vcpkg writes its binary
      # cache under %LOCALAPPDATA%, and nothing was ever being saved.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache/archives,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-cache/downloads
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Rolling cache: the exact key never hits, so every run banks an updated
      # archive set, while restore-keys pull in the newest previous one. The key
      # deliberately does not encode the dependency list - vcpkg's archives are
      # content-addressed, so an out-of-date cache costs a rebuild of whatever
      # changed and nothing more, and release.yml can share the same entries.
      # Caches saved here on main are what tag builds restore from.
      - name: Cache the vcpkg archives and downloads
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-cache/archives
            vcpkg-cache/downloads
          key: vcpkg-x64-windows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-${{ runner.os }}-

      - name: Install Qt (with QtPdf and QtSpeech)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          # qtmultimedia is a dependency of qtspeech's find_package config
          modules: "qtpdf qtspeech qtmultimedia"
          cache: true

      - name: Install vcpkg dependencies
        run: |
          # vcpkg refuses to use a binary cache directory that does not exist,
          # and on a cold cache the action has not created one.
          New-Item -ItemType Directory -Force vcpkg-cache\archives, vcpkg-cache\downloads | Out-Null
          vcpkg install $env:VCPKG_DEPS.Split(" ") --triplet x64-windows
          echo "VCPKG_INSTALLED=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Cache the poppler-qt6 build
        id: poppler-cache
        uses: actions/cache@v4
        with:
          path: deps/poppler
          key: poppler-25.07.0-qt6.8.3-msvc-${{ runner.os }}

      - name: Build poppler-qt6
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        run: .\scripts\build-poppler.ps1 -QtDir $env:QT_ROOT_DIR -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      # No explicit -G: the runner image tracks the current Visual Studio
      # (VS 2026 as of windows-2025-vs2026), so let CMake pick the newest one.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:GITHUB_WORKSPACE/deps/poppler;$env:VCPKG_INSTALLED"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Verify the binary was produced
        run: if (-not (Test-Path build\RelWithDebInfo\feather-pdf-pro.exe)) { exit 1 }

      - name: Put runtime DLLs on PATH for the tests
        run: |
          echo "$env:VCPKG_INSTALLED\bin" >> $env:GITHUB_PATH
          echo "$env:GITHUB_WORKSPACE\deps\poppler\bin" >> $env:GITHUB_PATH

      - name: Run tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      # The tests all run against the build tree, so nothing else would notice a
      # DLL or plugin missing from the packaged tree until someone installed a
      # release. Stage it and run the CLI with the build environment stripped
      # off PATH — that is the app a user actually gets.
      - name: Verify the app stages into a runnable tree
        run: |
          # Absolute: Qt's deploy support rejects a relative install prefix.
          cmake --install build --prefix "$env:GITHUB_WORKSPACE\staging" --config RelWithDebInfo
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & staging\bin\feather-pdf-pro.exe --version
          if ($LASTEXITCODE -ne 0) { throw "The staged CLI failed to start (exit $LASTEXITCODE)" }
