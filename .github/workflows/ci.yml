# Feather PDF Pro — continuous integration: build on Windows with MSVC + Qt 6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Windows / MSVC / Qt 6)
    runs-on: windows-latest
    env:
      VCPKG_DEPS: freetype libjpeg-turbo openjpeg libpng tiff lcms zlib qpdf openssl
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Install Qt (with QtPdf and QtSpeech)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: "qtpdf qtspeech"
          cache: true

      - name: Install vcpkg dependencies
        run: |
          vcpkg install $env:VCPKG_DEPS.Split(" ") --triplet x64-windows
          echo "VCPKG_INSTALLED=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      - name: Cache the poppler-qt6 build
        id: poppler-cache
        uses: actions/cache@v4
        with:
          path: deps/poppler
          key: poppler-25.07.0-qt6.8.3-msvc-${{ runner.os }}

      - name: Build poppler-qt6
        if: steps.poppler-cache.outputs.cache-hit != 'true'
        run: .\scripts\build-poppler.ps1 -QtDir $env:QT_ROOT_DIR -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:GITHUB_WORKSPACE/deps/poppler;$env:VCPKG_INSTALLED"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Verify the binary was produced
        run: if (-not (Test-Path build\src\RelWithDebInfo\feather-pdf.exe)) { exit 1 }

      - name: Run tests
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
