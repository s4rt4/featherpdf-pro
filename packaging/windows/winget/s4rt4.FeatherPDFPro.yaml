# Feather PDF Pro — winget version manifest, for publishing to
# microsoft/winget-pkgs so users can `winget install s4rt4.FeatherPDFPro`.
# (No README in this directory — `winget validate` parses every file here.)
#
# winget-pkgs only accepts publicly downloadable installers, so submission
# needs a public GitHub release. Per release:
#   1. iscc packaging\windows\feather-pdf-pro.iss, attach the setup exe to a
#      release tagged v<version>.
#   2. Bump PackageVersion + InstallerUrl in all three manifests.
#   3. winget hash feather-pdf-pro-<version>-setup.exe → InstallerSha256.
#   4. winget validate --manifest packaging\windows\winget
#      winget install --manifest packaging\windows\winget  (needs the
#      LocalManifestFiles setting enabled)
#   5. PR to microsoft/winget-pkgs under
#      manifests/s/s4rt4/FeatherPDFPro/<version>/ — or let wingetcreate do it:
#      wingetcreate update s4rt4.FeatherPDFPro --urls <url> --version <v> --submit
#      (first submission: wingetcreate new)
PackageIdentifier: s4rt4.FeatherPDFPro
PackageVersion: 0.0.1
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.6.0
